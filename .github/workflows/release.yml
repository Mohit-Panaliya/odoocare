name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (MSI + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci
        working-directory: src

      - name: Install Tauri CLI
        run: npm ci
        working-directory: src-tauri

      - name: Build
        run: npx tauri build --ci
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  build-macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
          - platform: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend deps
        run: npm ci
        working-directory: src

      - name: Install Tauri CLI
        run: npm ci
        working-directory: src-tauri

      - name: Build
        run: npx tauri build --ci --target ${{ matrix.target }} --no-sign
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app

  build-linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: x64
          - platform: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci
        working-directory: src

      - name: Install Tauri CLI
        run: npm ci
        working-directory: src-tauri

      - name: Build
        run: npx tauri build --ci
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  build-android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend deps
        run: npm ci
        working-directory: src

      - name: Install Tauri CLI
        run: npm ci
        working-directory: src-tauri

      - name: Init Android project
        run: npx tauri android init --ci
        working-directory: src-tauri
        env:
          CI: 'true'

      - name: Build APK
        run: npx tauri android build --apk --ci
        working-directory: src-tauri
        env:
          CI: 'true'
          NDK_HOME: ${{ env.NDK_HOME }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  build-ios:
    name: iOS (simulator app — unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install frontend deps
        run: npm ci
        working-directory: src

      - name: Install Tauri CLI
        run: npm ci
        working-directory: src-tauri

      - name: Init iOS project
        run: npx tauri ios init --ci
        working-directory: src-tauri
        env:
          CI: 'true'

      - name: Build for simulator (unsigned)
        run: npx tauri ios build --ci --target aarch64-sim
        working-directory: src-tauri
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            src-tauri/gen/apple/**/build/**/*.app
            src-tauri/target/**/*.app
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.app' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.apk' \) -exec cp {} release-files/ \;
          ls -laR release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: OdooCARE ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## OdooCARE v${{ github.event.inputs.release_tag || github.ref_name }}

            Odoo 17 CE Module Dependency Analyzer — a cross-platform desktop app built with Tauri v2.

            ### Downloads
            | File | Platform |
            |---|---|
            | `OdooCARE_...setup.exe` | Windows (NSIS, recommended) |
            | `OdooCARE_....msi` | Windows (MSI, enterprise) |
            | `OdooCARE_..._aarch64.dmg` | macOS (Apple Silicon) |
            | `OdooCARE_..._x64.dmg` | macOS (Intel) |
            | `OdooCARE_....deb` / `.rpm` / `.AppImage` | Linux |
            | `OdooCARE_....apk` | Android (APK) |
            | iOS `.app` | iOS (simulator build, unsigned) |

            **Note:** The iOS build is unsigned and targets the iOS Simulator — a signed, device-installable `.ipa` requires Apple signing credentials. The Android APK uses a generated debug keystore.

            ### Features
            - Open an Odoo module ZIP and parse every `__manifest__.py`
            - Resolve the full dependency graph with priority-based activation order
            - Detect missing Odoo CE modules
            - Scan Python imports against Odoo 17 requirements.txt
            - Export markdown dependency reports
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}